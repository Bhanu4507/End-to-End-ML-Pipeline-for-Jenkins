name: Trigger Jenkins Job


on:
  workflow_dispatch:
  #push: # this two lines are extra for whenever you push code, this trigger will happen
    #branches: [main] # whenever you push code, this trigger will happen
    
jobs:
  trigger:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Jenkins Job
        uses: appleboy/jenkins-action@master
        with:
          url: ${{ secrets.URL }}
          user: ${{ secrets.USER }}
          token: ${{ secrets.TOKEN }}
          job: ${{ secrets.JOBS }}
